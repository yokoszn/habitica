name: Security scans

on:
  pull_request:
  push:
    branches:
      - self-host
  schedule:
    - cron: "17 3 * * 1" # weekly, to pick up newly published advisories
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  opengrep:
    name: OpenGrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      OPENGREP_VERSION: v1.30.1
      # install.sh of the v1.30.1 tag, pinned by commit and content hash
      OPENGREP_INSTALLER_COMMIT: 525e67142af506e2f3ea1728d18c5824813f0248
      OPENGREP_INSTALLER_SHA256: 4643968d05a2d5f9d4130c0c170fc096d6adf8131aca002ba2fd0e482ac52d0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the OpenGrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep/rules-src
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5 # the OpenGrep installer verifies with the cosign v2 flags
      - name: Install OpenGrep (signature verified with cosign)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengrep-install.sh" \
            "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALLER_COMMIT}/install.sh"
          echo "${OPENGREP_INSTALLER_SHA256}  $RUNNER_TEMP/opengrep-install.sh" | sha256sum --check --strict
          bash "$RUNNER_TEMP/opengrep-install.sh" -v "$OPENGREP_VERSION" --verify-signatures
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"
      - name: Select rules
        # The rules repository mixes rule files with their test fixtures; keep only rule files.
        # Rules that only produce noise for this code base are dropped:
        # i18next (not used), npm package hygiene, and v-html (the client renders sanitized
        # markdown through v-html in hundreds of places; XSS is covered by the markdown rules).
        run: |
          mkdir -p .opengrep/rules
          for pack in javascript typescript dockerfile yaml generic html json bash; do
            find ".opengrep/rules-src/$pack" -type f \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name '*.test.*' ! -name '*.fixed.*' -print0 |
              xargs -0 grep -l '^rules:' |
              while read -r rule; do
                dest=".opengrep/rules/${rule#.opengrep/rules-src/}"
                mkdir -p "$(dirname "$dest")"
                cp "$rule" "$dest"
              done
          done
          rm -rf .opengrep/rules/typescript/react/portability/i18next \
            .opengrep/rules/json/npm \
            .opengrep/rules/javascript/vue/security/audit/xss/templates/avoid-v-html.yaml
          find .opengrep/rules -type f | wc -l
      - name: Scan
        run: |
          opengrep scan --config .opengrep/rules \
            --sarif-output=opengrep.sarif \
            --exclude=node_modules --exclude=test --exclude=migrations \
            --exclude=website/client/public --exclude=habitica-images \
            --exclude=website/common/locales --exclude=website/transpiled-babel \
            --exclude=database_reports --exclude=.opengrep \
            --max-target-bytes=1000000 \
            .
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('opengrep.sarif') != ''
        with:
          sarif_file: opengrep.sarif
          category: opengrep

  trivy:
    name: Trivy (dependencies, misconfiguration, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          # Dependency alerts point at lockfile lines, so code scanning reports every existing
          # advisory as new in a pull request that touches a lockfile. On pull requests, new
          # vulnerable dependencies are reported by OSV-Scanner and Dependency review instead.
          scanners: ${{ github.event_name == 'pull_request' && 'misconfig,secret' || 'vuln,misconfig,secret' }}
          skip-dirs: habitica-images,website/client/public
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

  zizmor:
    name: zizmor (GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  osv-scanner:
    name: OSV-Scanner
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --lockfile=website/client/package-lock.json
      fail-on-vuln: false

  osv-scanner-pr:
    # Fails only for vulnerabilities that the pull request introduces.
    name: OSV-Scanner (new vulnerabilities)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --lockfile=website/client/package-lock.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Dependency review needs the dependency graph, which is disabled by default for forks
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The API answers 403 when the dependency graph is disabled (the action reports
          # any 403 that way too)
          if output=$(gh api "repos/${REPO}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" 2>&1); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q "(HTTP 403)" <<< "$output"; then
            echo "::warning title=Dependency review skipped::The dependency graph is disabled for this repository. Enable it in the repository settings under Advanced Security (Code security)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
          show-openssf-scorecard: true
