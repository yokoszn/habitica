# OpenSSF Scorecard: https://github.com/ossf/scorecard
# Publishing the results has workflow restrictions (no top-level env, only approved
# actions in the analysis job): https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "41 2 * * 6"
  push:
    branches:
      - self-host
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results to the Scorecard API (badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@88585263c0627ee42c0e1c5143a112c8d6f4aa18 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
