name: Create Release

on:
  schedule:
    - cron: "20 3 * * *" # run every night
  workflow_dispatch: # allow manual running

permissions:
  contents: read

jobs:
  BranchAndRebase:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release branch
    steps:
      - name: Retrieve version
        run: |
          version=$(git ls-remote --sort='-version:refname' --tags --refs https://github.com/HabitRPG/habitica.git | head -n1 | sed 's/.*\/v\?//')
          # The version comes from an upstream tag name and is used in shell commands and image tags
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream version '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: version
      - name: Check release branch exists already
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git ls-remote --sort='-version:refname' --refs "https://github.com/${REPOSITORY}.git" | grep "releases/v${VERSION}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        id: exists
      - name: Checkout
        if: steps.exists.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1000 # greater than the number of commits you made
          persist-credentials: true # needed for the push below # zizmor: ignore[artipacked]
      - id: rebase
        if: steps.exists.outputs.exists != 'true'
        name: Rebase on upstream release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -ex

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "GitHub Actions"

          git remote add upstream https://github.com/HabitRPG/habitica.git
          git fetch --tags upstream "v${VERSION}"

          git checkout -b "releases/v${VERSION}"
          git rebase "v${VERSION}"

          git push origin "$(git branch --show-current)" --force-with-lease

        shell: bash

  CheckContainerExistence:
    outputs:
      exists: ${{ steps.exists.outputs.exists }}
    runs-on: ubuntu-latest
    needs: BranchAndRebase
    steps:
      - name: Check if container exists already
        env:
          VERSION: ${{ needs.BranchAndRebase.outputs.version }}
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
        run: |
          if wget -q -O - "https://hub.docker.com/v2/namespaces/${DOCKER_HUB_USER}/repositories/habitica-server/tags?page_size=10" | grep -o '"name": *"[^"]*' | grep -qF "$VERSION" \
              && wget -q -O - "https://hub.docker.com/v2/namespaces/${DOCKER_HUB_USER}/repositories/habitica-client/tags?page_size=10" | grep -o '"name": *"[^"]*' | grep -qF "$VERSION"; then
            echo "Container images exist already."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        id: exists

  BuildAndPushContainer:
    runs-on: ubuntu-latest
    needs: [BranchAndRebase, CheckContainerExistence]
    if: needs.CheckContainerExistence.outputs.exists == 'false'
    permissions:
      contents: read
      id-token: write # keyless signing of the pushed images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push container
        uses: ./.github/actions/build-container
        with:
          version: ${{ needs.BranchAndRebase.outputs.version }}
          push_containers: "true"
          create_release: "true"
          registry_user: ${{ secrets.DOCKER_HUB_USER }}
          registry_token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          release_access_token: ${{ secrets.ACTIONS_ACCESS_TOKEN }}
