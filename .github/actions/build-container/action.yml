name: Container
description: Action for building the containers for a given release version
inputs:
  version:
    required: true
    description: "The version tag for which the containers should be built"
  push_containers:
    required: false
    default: "true"
    description: "Whether the containers should be pushed to the registry after build"
  create_release:
    required: false
    default: "true"
    description: "Whether a release should be created after building the containers"
  registry_user:
    required: true
    description: "User name for the container registry"
  registry_token:
    required: true
    description: "Access token for the container registry"
  release_access_token:
    required: true
    description: "Access token used to create a release"
runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if ! [[ "$VERSION" =~ ^(develop|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "Invalid version '$VERSION'" >&2
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: inputs.create_release == 'true'
      with:
        ref: "releases/v${{ inputs.version }}"
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.registry_user }}
        password: ${{ inputs.registry_token }}
    - name: Determine major version
      run: echo "version_major=$(echo "$VERSION" | cut -d. -f1)" >> "$GITHUB_OUTPUT"
      shell: bash
      id: version_major
      env:
        VERSION: ${{ inputs.version }}
    - name: Build and Push Server Develop
      id: server_develop
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      if: inputs.create_release != 'true'
      with:
        target: server
        platforms: linux/amd64
        push: ${{ inputs.push_containers }}
        tags: ${{ inputs.registry_user }}/habitica-server:${{ inputs.version }}
        cache-from: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache
        cache-to: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache,mode=max
        sbom: true
        provenance: mode=max
    - name: Build and Push Server Release
      id: server_release
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      if: inputs.create_release == 'true'
      with:
        target: server
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.push_containers }}
        tags: ${{ inputs.registry_user }}/habitica-server:latest,${{ inputs.registry_user }}/habitica-server:${{ steps.version_major.outputs.version_major }},${{ inputs.registry_user }}/habitica-server:${{ inputs.version }}
        cache-from: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache
        cache-to: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache,mode=max
        sbom: true
        provenance: mode=max
    - name: Build and Push Client Develop
      id: client_develop
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      if: inputs.create_release != 'true'
      with:
        target: client
        platforms: linux/amd64
        push: ${{ inputs.push_containers }}
        tags: ${{ inputs.registry_user }}/habitica-client:${{ inputs.version }}
        cache-from: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache
        cache-to: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache,mode=max
        sbom: true
        provenance: mode=max
    - name: Build and Push Client Release
      id: client_release
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      if: inputs.create_release == 'true'
      with:
        target: client
        platforms: linux/amd64,linux/arm64
        push: ${{ inputs.push_containers }}
        tags: ${{ inputs.registry_user }}/habitica-client:latest,${{ inputs.registry_user }}/habitica-client:${{ steps.version_major.outputs.version_major }},${{ inputs.registry_user }}/habitica-client:${{ inputs.version }}
        cache-from: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache
        cache-to: type=registry,ref=${{ inputs.registry_user }}/habitica-server:buildcache,mode=max
        sbom: true
        provenance: mode=max
    # Keyless signatures (Sigstore), verifiable with:
    # cosign verify <image> --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' \
    #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      if: inputs.push_containers == 'true'
    - name: Sign the container images
      if: inputs.push_containers == 'true'
      shell: bash
      env:
        REGISTRY_USER: ${{ inputs.registry_user }}
        SERVER_DIGEST: ${{ steps.server_develop.outputs.digest || steps.server_release.outputs.digest }}
        CLIENT_DIGEST: ${{ steps.client_develop.outputs.digest || steps.client_release.outputs.digest }}
      run: |
        cosign sign --yes "docker.io/${REGISTRY_USER}/habitica-server@${SERVER_DIGEST}"
        cosign sign --yes "docker.io/${REGISTRY_USER}/habitica-client@${CLIENT_DIGEST}"
    - name: Create Release Archives
      if: inputs.create_release == 'true'
      env:
        VERSION: ${{ inputs.version }}
        REGISTRY_USER: ${{ inputs.registry_user }}
      run: |
        mkdir -p artifacts

        docker create --name server "${REGISTRY_USER}/habitica-server:${VERSION}"
        docker cp server:/var/lib/habitica artifacts/
        pushd artifacts/habitica
        zip -r "../../habitica-server-v${VERSION}.zip" *
        popd
        cp "habitica-server-v${VERSION}.zip" habitica-server-latest.zip

        docker create --name client "${REGISTRY_USER}/habitica-client:${VERSION}"
        docker cp client:/var/www artifacts/
        pushd artifacts/www
        zip -r "../../habitica-client-v${VERSION}.zip" *
        popd
        cp "habitica-client-v${VERSION}.zip" habitica-client-latest.zip
      shell: bash
    # Replaces the archived marvinpinto/action-automatic-releases: the release (and its tag)
    # is recreated so that the tag points to the commit of this run.
    - name: Create releases
      if: inputs.create_release == 'true'
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.release_access_token }}
        GH_REPO: ${{ github.repository }}
      run: |
        publish_release () {
          local tag="$1"
          shift
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" "$@" --title "$tag" --target "$GITHUB_SHA" \
            --notes "Habitica self-hosted release based on Habitica v${VERSION}."
        }
        publish_release "v${VERSION}" "habitica-server-v${VERSION}.zip" "habitica-client-v${VERSION}.zip"
        publish_release latest habitica-server-latest.zip habitica-client-latest.zip --latest
      shell: bash
